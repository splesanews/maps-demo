<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    #map { position: absolute; inset: 0; }

    #style-loader {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      max-width: 420px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: #111;
    }

    #style-loader .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    #style-loader label {
      font-size: 13px;
      font-weight: 600;
      margin-right: 6px;
      white-space: nowrap;
    }

    #style-loader input[type="file"] {
      flex: 1;
      font-size: 13px;
    }

    #style-loader button {
      appearance: none;
      border: 1px solid rgba(0, 0, 0, 0.2);
      background: #fff;
      border-radius: 8px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #style-loader button:hover {
      background: #f3f3f3;
    }

    #style-status {
      font-size: 12px;
      line-height: 1.3;
      color: rgba(0,0,0,0.75);
      word-break: break-word;
      max-height: 90px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="style-loader" aria-label="Map style loader">
    <div class="row">
      <label for="styleFile">Style JSON</label>
      <input id="styleFile" type="file" accept="application/json,.json" />
      <button id="resetStyle" type="button">Reset</button>
    </div>
    <div id="style-status">Loading default style…</div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script>
    const DEFAULT_STYLE_URL = './osm-liberty.json';

    const styleFileEl = document.getElementById('styleFile');
    const resetBtnEl = document.getElementById('resetStyle');
    const statusEl = document.getElementById('style-status');

    // Optional: allow `?style=./some-style.json` to load a different JSON file.
    const initialStyleUrl = new URLSearchParams(window.location.search).get('style') || DEFAULT_STYLE_URL;

    const mapState = {
      map: null,
      center: [0, 20],
      zoom: 2,
    };

    function normalizeStyle(style) {
      if (!style || typeof style !== 'object') throw new Error('Invalid style JSON (expected an object)');

      // Keep the existing behavior: wire openmaptiles to the OpenFreeMap endpoint, and remove
      // open_zoomstack if present.
      const sources = style.sources || {};

      if (sources.openmaptiles && typeof sources.openmaptiles === 'object') {
        sources.openmaptiles = {
          ...sources.openmaptiles,
          type: 'vector',
          url: 'https://tiles.openfreemap.org/planet',
        };
      }

      if (sources.open_zoomstack) {
        delete sources.open_zoomstack;
      }

      style.sources = sources;
      return style;
    }

    function applyStyle(style) {
      const normalized = normalizeStyle(style);

      if (!mapState.map) {
        try {
          mapState.map = new maplibregl.Map({
            container: 'map',
            style: normalized,
            center: mapState.center,
            zoom: mapState.zoom,
          });
        } catch (err) {
          statusEl.textContent = `Error: ${err && err.message ? err.message : String(err)}`;
          return;
        }

        mapState.map.on('error', (e) => {
          statusEl.textContent = `Map error: ${e && e.error ? e.error.message : 'unknown error'}`;
        });

        mapState.map.once('load', () => {
          statusEl.textContent = 'Map ready.';
        });
        return;
      }

      statusEl.textContent = 'Applying style…';
      mapState.map.once('idle', () => {
        statusEl.textContent = 'Style applied.';
      });
      try {
        mapState.map.setStyle(normalized);
      } catch (err) {
        statusEl.textContent = `Error applying style: ${err && err.message ? err.message : String(err)}`;
      }
    }

    async function loadStyleFromUrl(url) {
      statusEl.textContent = `Loading style from ${url}…`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Failed to load style: ${res.status} ${res.statusText}`);
      const style = await res.json();
      applyStyle(style);
    }

    styleFileEl.addEventListener('change', async () => {
      const file = styleFileEl.files && styleFileEl.files[0];
      if (!file) return;

      statusEl.textContent = `Reading ${file.name}…`;
      try {
        const text = await file.text();
        const style = JSON.parse(text);
        applyStyle(style);
        statusEl.textContent = `Style loaded from ${file.name}.`;
      } catch (err) {
        statusEl.textContent = `Error: ${err && err.message ? err.message : String(err)}`;
      } finally {
        // Allow re-selecting the same file again.
        styleFileEl.value = '';
      }
    });

    resetBtnEl.addEventListener('click', async () => {
      styleFileEl.value = '';
      try {
        await loadStyleFromUrl(DEFAULT_STYLE_URL);
      } catch (err) {
        statusEl.textContent = `Error: ${err && err.message ? err.message : String(err)}`;
      }
    });

    (async () => {
      try {
        await loadStyleFromUrl(initialStyleUrl);
      } catch (err) {
        statusEl.textContent = `Error: ${err && err.message ? err.message : String(err)}`;
      }
    })();
  </script>
</body>
</html>
